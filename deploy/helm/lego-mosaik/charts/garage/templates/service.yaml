# S3 und Admin-API für App und Init-Job
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
  selector:
    {{- include "garage.selectorLabels" . | nindent 4 }}
---
# RPC zwischen den Knoten; auch nicht bereite Pods, damit sich ein neuer Cluster findet
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" . }}-headless
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
  selector:
    {{- include "garage.selectorLabels" . | nindent 4 }}
