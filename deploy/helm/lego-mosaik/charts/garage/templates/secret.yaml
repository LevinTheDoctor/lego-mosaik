{{- if not .Values.auth.existingSecret }}
{{- $name := include "garage.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if and $existing $existing.data }}{{ $old = $existing.data }}{{ end }}
{{- /* rpc_secret muss aus 64 Hex-Zeichen bestehen */}}
{{- $rpc := .Values.auth.rpcSecret | default (get $old "rpcSecret" | b64dec) | default (randAlphaNum 64 | sha256sum) }}
{{- $admin := .Values.auth.adminToken | default (get $old "adminToken" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  rpcSecret: {{ $rpc | b64enc | quote }}
  adminToken: {{ $admin | b64enc | quote }}
{{- end }}
