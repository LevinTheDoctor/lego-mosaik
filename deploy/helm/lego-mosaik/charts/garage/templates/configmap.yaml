apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "garage.fullname" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
data:
  garage.toml: |
    # rpc_secret und admin_token kommen aus GARAGE_RPC_SECRET und GARAGE_ADMIN_TOKEN
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = {{ .Values.replicationFactor }}

    rpc_bind_addr = "[::]:3901"

    [kubernetes_discovery]
    namespace = "{{ .Release.Namespace }}"
    service_name = "{{ include "garage.fullname" . }}"
    skip_crd = {{ .Values.kubernetesDiscovery.skipCrd }}

    [s3_api]
    s3_region = "{{ .Values.s3Region }}"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.{{ include "garage.fullname" . }}"

    [admin]
    api_bind_addr = "[::]:3903"
