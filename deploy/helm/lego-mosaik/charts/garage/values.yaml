# Garage (S3) für lego-mosaik. Layout, Bucket und S3-Key richtet der Job
# "garage-init" des Hauptcharts ein.
image:
  repository: dxflrs/garage
  tag: "v2.4.1"
  pullPolicy: IfNotPresent

# Knoten; mehr als 1 nur mit replicationFactor > 1 sinnvoll (z. B. 3 und 3)
replicaCount: 1
replicationFactor: 1
s3Region: garage

auth:
  # Leer = zufällig erzeugt und bei Upgrades beibehalten
  rpcSecret: ""
  adminToken: ""
  existingSecret: "" # Schlüssel: rpcSecret, adminToken

# Knoten finden sich über die Kubernetes-API (CRD garagenodes.deuxfleurs.fr)
kubernetesDiscovery:
  # true, wenn die CRD schon existiert oder der Cluster keine CRDs anlegen lässt
  skipCrd: false

persistence:
  enabled: true
  storageClass: ""
  meta:
    size: 1Gi
  data:
    size: 20Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
