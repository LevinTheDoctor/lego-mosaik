# Werte für lego-mosaik (Cloud-Variante). Siehe docs/cloud.md.

image:
  repository: ghcr.io/levinthedoctor/lego-mosaik
  tag: "" # leer = appVersion aus Chart.yaml
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Mit einem RWO-Volume (iSCSI) laufen alle Pods auf einem Knoten; mehr als 1 nur
# zusammen mit einem nodeSelector, sonst bleiben weitere Pods in ContainerCreating hängen
replicaCount: 1

config:
  logLevel: INFO
  logFormat: json # json oder text
  maxUploadMb: 20
  # Frontends, die die API im Browser aufrufen dürfen (kommagetrennt bzw. Regex)
  corsOrigins: ""
  corsOriginRegex: ""
  catalogRefreshSeconds: 60
  # OpenTelemetry: Tracing an, sobald ein Endpunkt gesetzt ist (z. B. http://otel-collector:4318)
  otlpEndpoint: ""
  # Zusätzlich gesetzte Umgebungsvariablen, z. B. BRICKLINK_* aus einem Secret
  extraEnv: []
  extraEnvFrom: []

# Optional: Bricklink-Studio-Farbtabelle (StudioColorDefinition.txt) aus einer ConfigMap.
# Ohne sie fehlen BrickLink-Farbcodes; LDraw-Codes kommen dann aus den Rebrickable-IDs.
studioColors:
  configMap: ""
  key: StudioColorDefinition.txt

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Rechte des Volumes nur anpassen, wenn sie nicht passen (sonst chown bei jedem Start)
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false # Die API hat keine Anmeldung: nur hinter Auth (z. B. oauth2-proxy) öffnen
  className: ""
  annotations:
    # Mosaike entstehen synchron und dauern bis zu Minuten; Bilder bis maxUploadMb
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  hosts:
    - host: lego-mosaik.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# /tmp für den Katalog-Import (Rebrickable-Dumps); Mosaike entstehen auf dem Volume
tmpVolume:
  sizeLimit: 2Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 3

metrics:
  # prometheus.io/*-Annotationen für Prometheus ohne Operator
  podAnnotations: true
  serviceMonitor:
    enabled: false # braucht den Prometheus Operator
    interval: 30s
    labels: {}

catalogImport:
  # Erster Import bei Install/Upgrade (überspringt, wenn der Katalog noch aktuell ist)
  onRelease: true
  schedule: "17 3 * * *" # täglich 03:17
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# --- Mosaik-Volume -----------------------------------------------------------------------
# Bilder und alle erzeugten Dateien der Mosaike; Metadaten liegen in PostgreSQL.
# Drei Wege zum Volume (in dieser Reihenfolge):
#   1. existingClaim: eigener PVC, z. B. von einem iSCSI-CSI-Treiber oder selbst angelegt
#   2. iscsi: Das Chart legt ein statisches PV auf der LUN an und bindet den PVC daran
#   3. sonst: PVC über storageClass (leer = Standard, bei k3s local-path)
persistence:
  existingClaim: ""
  size: 20Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  mountPath: /var/lib/lego-mosaik
  annotations: {}
  # Felder wie beim iSCSI-Volume von Kubernetes (in-tree), werden 1:1 übernommen.
  # Auf jedem Knoten, der den Pod bekommen kann, muss open-iscsi (iscsiadm) laufen.
  iscsi: {}
  #   targetPortal: 192.168.1.10:3260
  #   iqn: iqn.2005-10.org.freenas.ctl:lego-mosaik
  #   lun: 0
  #   fsType: ext4
  #   # Mit CHAP: Secret (Typ kubernetes.io/iscsi-chap) im Release-Namespace
  #   chapAuthSession: true
  #   secretRef:
  #     name: lego-mosaik-iscsi-chap
  #     namespace: lego

# --- Datenbank ----------------------------------------------------------------------------
# Externe Datenbank, wenn postgresql.enabled=false
externalDatabase:
  # SQLAlchemy-URL, z. B. postgresql+psycopg://user:pw@host:5432/db
  url: ""
  existingSecret: ""
  existingSecretKey: url

# --- Subcharts ----------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    username: lego
    database: lego_mosaik

nodeSelector: {}
tolerations: []
affinity: {}
