apiVersion: v1
kind: Service
metadata:
  name: {{ include "lego-mosaik.fullname" . }}
  labels:
    {{- include "lego-mosaik.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "lego-mosaik.selectorLabels" . | nindent 4 }}
