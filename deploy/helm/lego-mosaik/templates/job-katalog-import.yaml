{{- if .Values.catalogImport.onRelease }}
# Erster Teilekatalog nach Install/Upgrade. Kein Helm-Hook: Mit "helm install --wait"
# liefen post-install-Hooks erst nach der Readiness. Der Name enthält die Revision, weil
# Jobs unveränderlich sind; ttlSecondsAfterFinished räumt alte Läufe auf.
# Ist der Katalog noch aktuell, endet der Job sofort.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lego-mosaik.fullname" . }}-katalog-import-{{ .Release.Revision }}
  labels:
    {{- include "lego-mosaik.labels" . | nindent 4 }}
    app.kubernetes.io/component: katalog-import
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "lego-mosaik.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: katalog-import
    spec:
      {{- include "lego-mosaik.catalogImportPod" . | nindent 6 }}
{{- end }}
