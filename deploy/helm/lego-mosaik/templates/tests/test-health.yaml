# helm test <release>: prüft Readiness und Prometheus-Endpunkt über den Service
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lego-mosaik.fullname" . }}-test-health
  labels:
    {{- include "lego-mosaik.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "lego-mosaik.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - |
          import json, urllib.request
          base = "http://{{ include "lego-mosaik.fullname" . }}:{{ .Values.service.port }}"
          ready = json.load(urllib.request.urlopen(base + "/actuator/health/readiness"))
          assert ready["status"] == "UP", ready
          text = urllib.request.urlopen(base + "/actuator/prometheus").read().decode()
          assert "http_server_requests_seconds" in text
          print("ok", ready)
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
