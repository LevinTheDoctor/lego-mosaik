{{- if not .Values.s3.existingSecret }}
{{- $name := include "lego-mosaik.s3SecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if and $existing $existing.data }}{{ $old = $existing.data }}{{ end }}
{{- /* Format, das Garage beim Import verlangt: GK + 24 Hex bzw. 64 Hex */}}
{{- $keyId := get $old "accessKeyId" | b64dec | default (printf "GK%s" (randAlphaNum 32 | sha256sum | trunc 24)) }}
{{- $secret := get $old "secretAccessKey" | b64dec | default (randAlphaNum 64 | sha256sum) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lego-mosaik.labels" . | nindent 4 }}
  annotations:
    # Bei helm uninstall behalten: Garage kennt den Key weiterhin
    helm.sh/resource-policy: keep
type: Opaque
data:
  accessKeyId: {{ $keyId | b64enc | quote }}
  secretAccessKey: {{ $secret | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lego-mosaik.fullname" . }}-db
  labels:
    {{- include "lego-mosaik.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ .Values.externalDatabase.url | b64enc | quote }}
{{- end }}
