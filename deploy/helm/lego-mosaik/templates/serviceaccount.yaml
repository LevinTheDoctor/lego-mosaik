{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lego-mosaik.serviceAccountName" . }}
  labels:
    {{- include "lego-mosaik.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Die App braucht keinen Zugriff auf die Kubernetes-API
automountServiceAccountToken: false
{{- end }}
