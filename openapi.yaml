openapi: 3.1.0
info:
  title: LEGO-Mosaik-Service
  description: "Erzeugt aus Bildern baubare LEGO-Mosaike (lokal, ohne Authentifizierung).\n\nAblauf für\
    \ ein Frontend:\n\n1. `GET /optionen` liefert Standardwerte und erlaubte Werte aller Formularfelder.\n\
    2. Optional das Bild vorbereiten: `POST /bild/hintergrund` erkennt den Hintergrund,\n   `POST /bild/vorschau`\
    \ zeigt das bearbeitete Bild (Filter, Ausschnitt, Hintergrund).\n3. `POST /mosaike` mit dem Bild (multipart)\
    \ und optionalen Feldern, auch `preset` und\n   `palette`. Die Antwort kommt, wenn das Mosaik fertig\
    \ ist (Sekunden bis wenige Minuten).\n4. Vorschau, Anleitung und Teilelisten über die URLs in `dateien`\
    \ laden.\n5. Optional bearbeiten: `GET /mosaike/{id}/raster` liefert jede Noppe,\n   `POST /mosaike/{id}/bearbeiten`\
    \ färbt Noppen und Flächen um (neues Mosaik).\n6. Optional: `POST /mosaike/{id}/preise` schätzt den\
    \ Preis über BrickLink,\n   `GET /mosaike/{id}/bricklink` liefert die Wanted List zum Hochladen auf\
    \ BrickLink.\n\nEigene Farbpaletten (`/paletten`) und Presets mit Bewertung und Favoriten (`/presets`)\n\
    werden lokal in `daten/` gespeichert.\n\nFehler kommen immer als `{\"fehler\": \"…\"}` mit deutscher\
    \ Meldung.\n"
  version: 0.1.0
paths:
  /gesundheit:
    get:
      tags:
      - Katalog
      summary: Status und Stand des Teilekatalogs
      operationId: get_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthModel'
  /optionen:
    get:
      tags:
      - Mosaike
      summary: Standardwerte und erlaubte Werte der Formularfelder
      operationId: get_options
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsModel'
  /farben:
    get:
      tags:
      - Katalog
      summary: Palette für Teilarten und Farbkategorien
      operationId: list_colors
      parameters:
      - name: teile
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: z. B. plate,tile
          title: Teile
        description: z. B. plate,tile
      - name: farbkategorien
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: z. B. solid,pearl
          title: Farbkategorien
        description: z. B. solid,pearl
      - name: exotisch
        in: query
        required: false
        schema:
          type: boolean
          description: Alle Kategorien außer Gummi
          default: false
          title: Exotisch
        description: Alle Kategorien außer Gummi
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColorModel'
                title: Response List Colors
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /verfahren:
    get:
      tags:
      - Katalog
      summary: Registrierte Verfahren und Ausgaben
      operationId: list_methods
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
                title: Response List Methods
  /teile/aktualisieren:
    post:
      tags:
      - Katalog
      summary: Rebrickable-Katalog aktualisieren
      operationId: update_catalog
      parameters:
      - name: erzwingen
        in: query
        required: false
        schema:
          type: boolean
          description: Auch aktuelle Dateien neu laden
          default: false
          title: Erzwingen
        description: Auch aktuelle Dateien neu laden
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdateFileModel'
                title: Response Update Catalog
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /bild/hintergrund:
    post:
      tags:
      - Bild
      summary: Hintergrund erkennen
      description: Erkennt den Hintergrund (häufigste Randfarbe, zusammenhängend vom Rand aus) des gedrehten
        und zugeschnittenen Bilds. Mit `hintergrund_toleranz` steuern, wie ähnlich ein Pixel sein muss.
        Danach z. B. `hintergrund=entfernen` und `hintergrundfarbe=lego_farbe.id` an `POST /mosaike` schicken.
      operationId: detect_background
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_detect_background'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundModel'
        '400':
          description: Kein lesbares Bild
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '413':
          description: Datei zu groß
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /bild/vorschau:
    post:
      tags:
      - Bild
      summary: Bearbeitetes Bild als PNG
      description: Das Bild nach Drehen, Ausschnitt, Farbfilter, Helligkeit/Kontrast/Sättigung und Hintergrund,
        so wie es ins Dithering geht (noch nicht auf Noppen verkleinert).
      operationId: preview_image
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_preview_image'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '400':
          description: Kein lesbares Bild
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '413':
          description: Datei zu groß
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /mosaike:
    post:
      tags:
      - Mosaike
      summary: Mosaik erzeugen
      operationId: create_mosaic
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_mosaic'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicCreatedModel'
        '400':
          description: Kein lesbares Bild
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '413':
          description: Datei zu groß
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Verarbeitungsfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /mosaike/{mosaic_id}:
    get:
      tags:
      - Mosaike
      summary: Inhalt von ergebnis.json
      operationId: get_mosaic
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike/{mosaic_id}/dateien/{file_name}:
    get:
      tags:
      - Mosaike
      summary: Datei herunterladen
      operationId: download_file
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      - name: file_name
        in: path
        required: true
        schema:
          type: string
          title: File Name
      responses:
        '200':
          description: Die Datei (PNG, PDF, LDraw, CSV, XML, JSON oder Originalbild)
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike/{mosaic_id}/raster:
    get:
      tags:
      - Mosaike
      summary: Farbraster für einen Editor
      description: Farbe jeder Noppe (Inhalt von `raster.json`). Zeilen und Spalten zählen ab 1 inklusive
        Rahmen, so wie `POST /mosaike/{id}/bearbeiten` sie erwartet.
      operationId: get_raster
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike/{mosaic_id}/bearbeiten:
    post:
      tags:
      - Mosaike
      summary: Noppen und Flächen umfärben
      description: 'Rechnet das Mosaik mit den Änderungen neu: Teile, Teilelisten und Anleitung passen
        danach zum Bild. Es entsteht ein neues Mosaik mit neuer ID (`basis` zeigt auf dieses); das alte
        bleibt. Änderungen sammeln sich, das neue Mosaik lässt sich also weiter bearbeiten. Erlaubt ist
        jede Farbe, die es für Teilarten und Stil als 1×1-Teil gibt; der Rahmen bleibt fest.'
      operationId: edit_mosaic
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequestModel'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicCreatedModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Verarbeitungsfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /paletten:
    get:
      tags:
      - Paletten
      summary: Eigene Farbpaletten
      operationId: list_palettes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaletteModel'
                type: array
                title: Response List Palettes
    post:
      tags:
      - Paletten
      summary: Palette anlegen
      operationId: create_palette
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaletteInputModel'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /paletten/{palette_id}:
    get:
      tags:
      - Paletten
      summary: Eine Palette
      operationId: get_palette
      parameters:
      - name: palette_id
        in: path
        required: true
        schema:
          type: string
          title: Palette Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Paletten
      summary: Palette ersetzen
      operationId: update_palette
      parameters:
      - name: palette_id
        in: path
        required: true
        schema:
          type: string
          title: Palette Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaletteInputModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    delete:
      tags:
      - Paletten
      summary: Palette löschen
      operationId: delete_palette
      parameters:
      - name: palette_id
        in: path
        required: true
        schema:
          type: string
          title: Palette Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /presets:
    get:
      tags:
      - Presets
      summary: Presets (Favoriten zuerst)
      operationId: list_presets
      parameters:
      - name: sortierung
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PresetOrder'
          description: 'Nach Favoriten: bewertung, nutzung, name oder neu'
          default: bewertung
        description: 'Nach Favoriten: bewertung, nutzung, name oder neu'
      - name: favoriten
        in: query
        required: false
        schema:
          type: boolean
          description: Nur Favoriten
          default: false
          title: Favoriten
        description: Nur Favoriten
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PresetModel'
                title: Response List Presets
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Presets
      summary: Preset anlegen
      description: Die Einstellungen werden wie bei `POST /mosaike` geprüft.
      operationId: create_preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetInputModel'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /presets/{preset_id}:
    get:
      tags:
      - Presets
      summary: Ein Preset
      operationId: get_preset
      parameters:
      - name: preset_id
        in: path
        required: true
        schema:
          type: string
          title: Preset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Presets
      summary: Preset ersetzen
      operationId: update_preset
      parameters:
      - name: preset_id
        in: path
        required: true
        schema:
          type: string
          title: Preset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetInputModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    patch:
      tags:
      - Presets
      summary: Favorit oder Bewertung setzen
      operationId: mark_preset
      parameters:
      - name: preset_id
        in: path
        required: true
        schema:
          type: string
          title: Preset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetMarkModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    delete:
      tags:
      - Presets
      summary: Preset löschen
      operationId: delete_preset
      parameters:
      - name: preset_id
        in: path
        required: true
        schema:
          type: string
          title: Preset Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike/{mosaic_id}/preset:
    post:
      tags:
      - Presets
      summary: Einstellungen eines Mosaiks als Preset speichern
      operationId: preset_from_mosaic
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetFromMosaicModel'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /mosaike/{mosaic_id}/preise:
    post:
      tags:
      - BrickLink
      summary: Preis bei BrickLink schätzen
      description: Fragt fehlende oder veraltete Preise beim BrickLink Price Guide ab (Verkäufe der letzten
        6 Monate und aktuelle Angebote) und speichert `preise.json`, `preise_bricklink.csv` und die Wanted
        List im Mosaik.
      operationId: estimate_prices
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      - name: offline
        in: query
        required: false
        schema:
          type: boolean
          description: Nur gespeicherte Preise, keine Abfrage
          default: false
          title: Offline
        description: Nur gespeicherte Preise, keine Abfrage
      - name: erzwingen
        in: query
        required: false
        schema:
          type: boolean
          description: Alle Preise neu abfragen, auch aktuelle
          default: false
          title: Erzwingen
        description: Alle Preise neu abfragen, auch aktuelle
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceEstimateModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '502':
          description: BrickLink antwortet nicht oder mit einem Fehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '503':
          description: BrickLink-Zugangsdaten fehlen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    get:
      tags:
      - BrickLink
      summary: Gespeicherte Preisschätzung
      operationId: get_prices
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceEstimateModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike/{mosaic_id}/bricklink:
    get:
      tags:
      - BrickLink
      summary: Wanted List für BrickLink
      description: Die BrickLink-XML zum Einfügen auf der Upload-Seite (`upload_url`). Die BrickLink-API
        selbst kann keine Wanted Lists anlegen.
      operationId: get_bricklink_export
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrickLinkExportModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
components:
  schemas:
    AreaEditModel:
      properties:
        zeile:
          type: integer
          minimum: 1.0
          title: Zeile
          description: Zeile ab 1, inklusive Rahmen (wie in der Anleitung)
        spalte:
          type: integer
          minimum: 1.0
          title: Spalte
