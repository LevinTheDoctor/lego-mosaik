openapi: 3.1.0
info:
  title: LEGO-Mosaik-Service
  description: "Erzeugt aus Bildern baubare LEGO-Mosaike (lokal, ohne Authentifizierung).\n\nAblauf für\
    \ ein Frontend:\n\n1. `GET /optionen` liefert Standardwerte und erlaubte Werte aller Formularfelder.\n\
    2. `POST /mosaike` mit dem Bild (multipart) und optionalen Feldern. Die Antwort kommt,\n   wenn das\
    \ Mosaik fertig ist (Sekunden bis wenige Minuten).\n3. Vorschau, Anleitung und Teilelisten über die\
    \ URLs in `dateien` laden.\n\nFehler kommen immer als `{\"fehler\": \"…\"}` mit deutscher Meldung.\n"
  version: 0.1.0
paths:
  /gesundheit:
    get:
      tags:
      - Katalog
      summary: Status und Stand des Teilekatalogs
      operationId: get_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthModel'
  /optionen:
    get:
      tags:
      - Mosaike
      summary: Standardwerte und erlaubte Werte der Formularfelder
      operationId: get_options
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsModel'
  /farben:
    get:
      tags:
      - Katalog
      summary: Palette für Teilarten und Farbkategorien
      operationId: list_colors
      parameters:
      - name: teile
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: z. B. plate,tile
          title: Teile
        description: z. B. plate,tile
      - name: farbkategorien
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: z. B. solid,pearl
          title: Farbkategorien
        description: z. B. solid,pearl
      - name: exotisch
        in: query
        required: false
        schema:
          type: boolean
          description: Alle Kategorien außer Gummi
          default: false
          title: Exotisch
        description: Alle Kategorien außer Gummi
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColorModel'
                title: Response List Colors
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /verfahren:
    get:
      tags:
      - Katalog
      summary: Registrierte Verfahren und Ausgaben
      operationId: list_methods
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
                title: Response List Methods
  /teile/aktualisieren:
    post:
      tags:
      - Katalog
      summary: Rebrickable-Katalog aktualisieren
      operationId: update_catalog
      parameters:
      - name: erzwingen
        in: query
        required: false
        schema:
          type: boolean
          description: Auch aktuelle Dateien neu laden
          default: false
          title: Erzwingen
        description: Auch aktuelle Dateien neu laden
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdateFileModel'
                title: Response Update Catalog
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike:
    post:
      tags:
      - Mosaike
      summary: Mosaik erzeugen
      operationId: create_mosaic
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_mosaic'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicCreatedModel'
        '400':
          description: Kein lesbares Bild
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '413':
          description: Datei zu groß
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Ungültige Angaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Verarbeitungsfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /mosaike/{mosaic_id}:
    get:
      tags:
      - Mosaike
      summary: Inhalt von ergebnis.json
      operationId: get_mosaic
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultModel'
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mosaike/{mosaic_id}/dateien/{file_name}:
    get:
      tags:
      - Mosaike
      summary: Datei herunterladen
      operationId: download_file
      parameters:
      - name: mosaic_id
        in: path
        required: true
        schema:
          type: string
          title: Mosaic Id
      - name: file_name
        in: path
        required: true
        schema:
          type: string
          title: File Name
      responses:
        '200':
          description: Die Datei (PNG, PDF, LDraw, CSV, XML oder JSON)
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_create_mosaic:
      properties:
        bild:
          type: string
          contentMediaType: application/octet-stream
          title: Bild
          description: Bilddatei (JPG, PNG, …)
        unterbau:
          anyOf:
          - type: string
            enum:
            - art
            - grundplatte
            - platten
            - ohne
          - type: 'null'
          title: Unterbau
          description: 'Unterbau (Standard: art)'
        plattengroesse:
          anyOf:
          - type: integer
            enum:
            - 16
            - 32
            - 48
          - type: 'null'
          title: Plattengroesse
          description: 'Plattengröße in Noppen (Standard: 16)'
        format:
          anyOf:
          - type: string
            enum:
            - mini
            - klein
            - quadrat
            - gross
            - riesig
            - quer
            - hoch
            - breit
            - panorama
            - weltkarte
          - type: 'null'
          title: Format
          description: Format wie bei LEGO Art (statt platten)
        platten:
          anyOf:
          - type: string
          - type: 'null'
          title: Platten
          description: 'Platten als BxH, z. B. 3x3 (Standard: 3x3)'
        breite:
          anyOf:
          - type: integer
            maximum: 384.0
            minimum: 8.0
          - type: 'null'
          title: Breite
          description: Eigene Breite in Noppen
        hoehe:
          anyOf:
          - type: integer
            maximum: 384.0
            minimum: 8.0
          - type: 'null'
          title: Hoehe
          description: Eigene Höhe in Noppen
        unterbaufarbe:
          anyOf:
          - type: integer
          - type: 'null'
          title: Unterbaufarbe
          description: Rebrickable-ID (Standard je nach Unterbau)
        rahmen:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Rahmen
          description: 'Rahmenbreite in Noppen (Standard: 1)'
        rahmenfarbe:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rahmenfarbe
          description: 'Rebrickable-ID des Rahmens (Standard: 0)'
        eckenfarbe:
          anyOf:
          - type: integer
          - type: 'null'
          title: Eckenfarbe
          description: Rebrickable-ID der Ecken
        rahmen_teile:
          anyOf:
          - type: string
          - type: 'null'
          title: Rahmen Teile
          description: 'Teilarten des Rahmens. Kommagetrennt aus: plate, tile, brick (Standard: tile)'
        rahmen_erhoehung:
          anyOf:
          - type: integer
            maximum: 3.0
            minimum: 0.0
          - type: 'null'
          title: Rahmen Erhoehung
          description: 'Plates unter dem Rahmen (Standard: 1)'
        modus:
          anyOf:
          - type: string
            enum:
            - zuschneiden
            - einpassen
          - type: 'null'
          title: Modus
          description: 'Bild zuschneiden oder einpassen (Standard: zuschneiden)'
        kontrast:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Kontrast
          description: 'Kontrast, 1.0 = unverändert (Standard: 1.0)'
        saettigung:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Saettigung
          description: 'Sättigung, 1.0 = unverändert (Standard: 1.0)'
        teile:
          anyOf:
          - type: string
          - type: 'null'
          title: Teile
          description: 'Teilarten des Bilds. Kommagetrennt aus: plate, tile, brick (Standard: plate,tile)'
        farbkategorien:
          anyOf:
          - type: string
          - type: 'null'
          title: Farbkategorien
          description: 'Farbkategorien. Kommagetrennt aus: solid, transparent, metallic, pearl, chrome,
            glitter, speckle, satin, milky, rubber (Standard: solid)'
        exotische_farben:
          type: boolean
          title: Exotische Farben
          description: 'Alle Farbkategorien außer Gummi (Standard: nein)'
          default: false
        max_farben:
          anyOf:
          - type: integer
            maximum: 147456.0
            minimum: 0.0
          - type: 'null'
          title: Max Farben
          description: 'Höchstens so viele Farben, 0 = alle (Standard: 0)'
        stil:
          anyOf:
          - type: string
            enum:
            - quadrat
            - formen
            - punkte
            - noppen
          - type: 'null'
          title: Stil
          description: 'Stil der Bildteile (Standard: formen)'
        relief:
          anyOf:
          - type: string
            enum:
            - ohne
            - motiv
            - hell
            - dunkel
          - type: 'null'
          title: Relief
          description: 'Was erhöht wird (Standard: ohne)'
        relief_hoehe:
          anyOf:
          - type: integer
            maximum: 3.0
            minimum: 1.0
          - type: 'null'
          title: Relief Hoehe
          description: 'Höchste Relief-Stufe in Plates (Standard: 1)'
        dithering:
          anyOf:
          - type: string
            enum:
            - nearest
            - floyd_steinberg
            - atkinson
            - sierra_lite
            - ordered
          - type: 'null'
          title: Dithering
          description: 'Dithering-Verfahren (Standard: floyd_steinberg)'
        staerke:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Staerke
          description: 'Dithering-Stärke (Standard: 1.0)'
        farbabstand:
          anyOf:
          - type: string
            enum:
            - cie76
            - ciede2000
          - type: 'null'
          title: Farbabstand
          description: 'Formel für den Farbabstand (Standard: ciede2000)'
        aufraeumen:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Aufraeumen
          description: 'Einzelne Pixel durch die Nachbarfarbe ersetzen (Standard: nein)'
        zerlegung:
          anyOf:
          - type: string
            enum:
            - single_stud
            - greedy
          - type: 'null'
          title: Zerlegung
          description: 'Zerlegungsverfahren (Standard: greedy)'
        ausgaben:
          anyOf:
          - type: string
          - type: 'null'
          title: Ausgaben
          description: 'Erzeugte Dateien (ergebnis.json kommt immer dazu). Kommagetrennt aus: preview_png,
            ldraw, parts_list_csv, official_parts_lists, instructions_png, result_json (Standard: preview_png,ldraw,parts_list_csv,official_parts_lists,instructions_png,result_json)'
        titel:
          anyOf:
          - type: string
          - type: 'null'
          title: Titel
          description: 'Name auf dem Titelblatt (Standard: Dateiname)'
      type: object
      required:
      - bild
      title: Body_create_mosaic
    CatalogFileModel:
      properties:
        datei:
          type: string
          title: Datei
          description: Dateiname der Rebrickable-CSV
        stand:
          anyOf:
          - type: string
          - type: 'null'
          title: Stand
          description: Letzte Änderung (ISO 8601, UTC) oder null
        veraltet:
          type: boolean
          title: Veraltet
          description: True, wenn die Datei fehlt oder zu alt ist
      type: object
      required:
      - datei
      - stand
      - veraltet
      title: CatalogFileModel
    ColorModel:
      properties:
        id:
          type: integer
          title: Id
          description: Rebrickable-Farb-ID
        name:
          type: string
          title: Name
          description: Farbname (Rebrickable)
        hex:
          type: string
          title: Hex
          description: 'Farbwert als #RRGGBB'
        kategorie:
          type: string
          title: Kategorie
          description: 'Oberfläche: solid, metallic, pearl, …'
        ldraw_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ldraw Code
          description: LDraw-Farbcode
        bricklink_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bricklink Code
          description: BrickLink-Farbcode, falls bekannt
        lego_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Lego Name
          description: Offizieller LEGO-Farbname, falls bekannt
      type: object
      required:
      - id
      - name
      - hex
      - kategorie
      - ldraw_code
      - bricklink_code
      - lego_name
      title: ColorModel
    ErrorModel:
      properties:
        fehler:
          type: string
          title: Fehler
          description: Deutsche Fehlermeldung, zum direkten Anzeigen gedacht
      type: object
      required:
      - fehler
      title: ErrorModel
    FieldOptionModel:
      properties:
        standard:
          $ref: '#/components/schemas/OptionValue'
          description: Wert ohne Angabe; null = ergibt sich
        werte:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Werte
          description: Erlaubte Werte; leer = frei
        mehrfach:
          type: boolean
          title: Mehrfach
          description: Kommagetrennte Liste aus ``werte``
        minimum:
          anyOf:
          - type: number
          - type: 'null'
          title: Minimum
          description: Kleinster erlaubter Wert
        maximum:
          anyOf:
          - type: number
          - type: 'null'
          title: Maximum
          description: Größter erlaubter Wert
      type: object
      required:
      - standard
      - werte
      - mehrfach
      - minimum
      - maximum
      title: FieldOptionModel
    FormatModel:
      properties:
        name:
          type: string
          title: Name
          description: Wert für das Feld ``format``
        platten_breite:
          type: integer
          title: Platten Breite
          description: Platten nebeneinander
        platten_hoehe:
          type: integer
          title: Platten Hoehe
          description: Platten untereinander
        beschreibung:
          type: string
          title: Beschreibung
          description: Kurze Beschreibung
      type: object
      required:
      - name
      - platten_breite
      - platten_hoehe
      - beschreibung
      title: FormatModel
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthModel:
      properties:
        status:
          type: string
          title: Status
          description: „ok“, wenn der Server läuft
        katalog:
          items:
            $ref: '#/components/schemas/CatalogFileModel'
          type: array
          title: Katalog
          description: Stand der Katalogdateien
      type: object
      required:
      - status
      - katalog
      title: HealthModel
    MosaicCreatedModel:
      properties:
        id:
          type: string
          title: Id
          description: ID des Mosaiks (Name des Ausgabeordners)
        statistik:
          $ref: '#/components/schemas/StatsModel'
          description: Kennzahlen des Mosaiks
        dateien:
          additionalProperties:
            type: string
          type: object
          title: Dateien
          description: Dateiname → absolute Download-URL
      type: object
      required:
      - id
      - statistik
      - dateien
      title: MosaicCreatedModel
    OptionValue:
      anyOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
      - type: 'null'
    OptionsModel:
      properties:
        felder:
          additionalProperties:
            $ref: '#/components/schemas/FieldOptionModel'
          type: object
          title: Felder
          description: Formularfeld von POST /mosaike → Standard und erlaubte Werte
        formate:
          items:
            $ref: '#/components/schemas/FormatModel'
          type: array
          title: Formate
          description: Formate wie bei LEGO Art
      type: object
      required:
      - felder
      - formate
      title: OptionsModel
    PaletteColorModel:
      properties:
        id:
          type: integer
          title: Id
          description: Rebrickable-Farb-ID
        name:
          type: string
          title: Name
          description: Farbname (Rebrickable)
        hex:
          type: string
          title: Hex
          description: 'Farbwert als #RRGGBB'
        ldraw_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ldraw Code
          description: LDraw-Farbcode
        noppen:
          type: integer
          title: Noppen
          description: Sichtbare Noppen in dieser Farbe
      type: object
      required:
      - id
      - name
      - hex
      - ldraw_code
      - noppen
      title: PaletteColorModel
    ResultModel:
      properties:
        titel:
          type: string
          title: Titel
          description: Name des Mosaiks (Titelblatt)
        breite:
          type: integer
          title: Breite
          description: Gesamtbreite in Noppen
        hoehe:
          type: integer
          title: Hoehe
          description: Gesamthöhe in Noppen
        konfiguration:
          additionalProperties: true
          type: object
          title: Konfiguration
          description: Vollständige Konfiguration des Laufs (Standardwerte plus Angaben)
        statistik:
          $ref: '#/components/schemas/StatsModel'
          description: Kennzahlen des Mosaiks
        anzahl_teile:
          type: integer
          title: Anzahl Teile
          description: Teile laut Teileliste (Summe aller Mengen)
        palette:
          items:
            $ref: '#/components/schemas/PaletteColorModel'
          type: array
          title: Palette
          description: Verwendete Farben
        dateien:
          items:
            type: string
          type: array
          title: Dateien
          description: Dateinamen; herunterladen über /mosaike/{id}/dateien/{name}
      type: object
      required:
      - titel
      - breite
      - hoehe
      - konfiguration
      - statistik
      - anzahl_teile
      - palette
      - dateien
      title: ResultModel
      description: Inhalt von ``ergebnis.json``.
    StatsModel:
      properties:
        breite:
          type: integer
          title: Breite
          description: Gesamtbreite in Noppen, mit Rahmen
        hoehe:
          type: integer
          title: Hoehe
          description: Gesamthöhe in Noppen, mit Rahmen
        bild_breite:
          type: integer
          title: Bild Breite
          description: Breite der Bildfläche in Noppen (ohne Rahmen)
        bild_hoehe:
          type: integer
          title: Bild Hoehe
          description: Höhe der Bildfläche in Noppen (ohne Rahmen)
        teile:
          type: integer
          title: Teile
          description: 'Alle Teile: Bild, Rahmen, Unterbau, Relief, Verbinder'
        farben:
          type: integer
          title: Farben
          description: Farben in der Teileliste (wie auf dem Titelblatt)
        altfarben:
          type: integer
          title: Altfarben
          description: Davon Farben, die in aktuellen Sets nicht mehr vorkommen
        anteil_1x1:
          type: number
          title: Anteil 1X1
          description: Anteil eckiger 1×1-Teile an allen Teilen (0 bis 1)
        pixels:
          type: integer
          title: Pixels
          description: Noppen der sichtbaren Oberfläche (Breite × Höhe)
        parts:
          type: integer
          title: Parts
          description: Teile der sichtbaren Oberfläche
        savings_percent:
          type: number
          title: Savings Percent
          description: Ersparnis gegenüber lauter 1×1-Teilen in %
        stuetzteile:
          type: integer
          title: Stuetzteile
          description: Plates unter einem erhöhten Rahmen
        formteile:
          type: integer
          title: Formteile
          description: Runde und schräge Teile im Bild
        relief_teile:
          type: integer
          title: Relief Teile
          description: Stützteile unter erhöhten Bildteilen
        unterlagen:
          type: integer
          title: Unterlagen
          description: Farbige Plates unter Formteilen
        unterbau_platten:
          type: integer
          title: Unterbau Platten
          description: Grundplatten, große Platten oder Art-Paneele
        verbinder:
          type: integer
          title: Verbinder
          description: Technic-Pins zwischen Art-Paneelen
        verbindungsteile:
          type: integer
          title: Verbindungsteile
          description: Plates, die große Platten verbinden
        seiten:
          type: integer
          title: Seiten
          description: Seiten der Bauanleitung (0 ohne Anleitung)
        dauer_sekunden:
          additionalProperties:
            type: number
          type: object
          title: Dauer Sekunden
          description: Dauer je Verarbeitungsschritt
      type: object
      required:
      - breite
      - hoehe
      - bild_breite
      - bild_hoehe
      - teile
      - farben
      - altfarben
      - anteil_1x1
      - pixels
      - parts
      - savings_percent
      - stuetzteile
      - formteile
      - relief_teile
      - unterlagen
      - unterbau_platten
      - verbinder
      - verbindungsteile
      - seiten
      - dauer_sekunden
      title: StatsModel
      description: Kennzahlen eines Mosaiks (``statistik`` in ``ergebnis.json``).
    UpdateFileModel:
      properties:
        datei:
          type: string
          title: Datei
          description: Dateiname
        status:
          type: string
          title: Status
          description: heruntergeladen, aktuell oder fehlgeschlagen
        hinweis:
          type: string
          title: Hinweis
          description: Erklärung, bei Fehlern der Grund
      type: object
      required:
      - datei
      - status
      - hinweis
      title: UpdateFileModel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
