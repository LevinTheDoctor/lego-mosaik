# Tests, Helm-Lint und Container-Image der Cloud-Variante.
#
# Bei jedem Push baut der Workflow das Image nativ für amd64 und arm64 (je ein Runner,
# scikit-image hat für Python 3.15 keine Wheels und wird kompiliert – unter QEMU zu langsam)
# und legt es öffentlich unter ghcr.io/levinthedoctor/lego-mosaik ab:
#   sha-<7 Zeichen>   jeder Commit (das nimmt deploy/k3s/deploy.sh im Frontend-Repo)
#   <branch>          letzter Stand des Branches
#   latest            letzter Stand von master
#   1.2.3, 1.2        Tags v1.2.3
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/levinthedoctor/lego-mosaik

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy
        working-directory: cloud
      - run: uv run pytest -q
      # Inklusive Integrationstests: testcontainers startet PostgreSQL im Docker des Runners
      - run: uv run pytest -q
        working-directory: cloud

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/lego-mosaik
      - name: Varianten rendern
        run: |
          set -e
          for args in "" \
            "--set persistence.storageClass=synology-iscsi-storage --set persistence.fixOwnership=true" \
            "--set persistence.iscsi.targetPortal=10.0.0.1:3260 --set persistence.iscsi.iqn=iqn.x:y --set persistence.iscsi.lun=0" \
            "--set postgresql.enabled=false --set externalDatabase.url=postgresql+psycopg://u:p@db/x --set ingress.enabled=true"; do
            helm template ci deploy/helm/lego-mosaik $args > /dev/null
          done

  # Je Architektur ein nativer Runner; das Ergebnis ist nur ein Digest ohne Tag
  image:
    if: github.event_name == 'push'
    needs: [python, helm]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: vars
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
            BUILD_TIME=${{ steps.vars.outputs.time }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.vars.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.arch }}
      - name: Digest merken
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Beide Digests zu einem Multi-Arch-Image mit allen Tags zusammenführen
  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Manifest-Liste anlegen
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
      - name: Smoke-Test (PostgreSQL + API, Readiness)
        run: |
          docker network create smoke
          docker run -d --name postgres --network smoke \
            -e POSTGRES_USER=lego -e POSTGRES_PASSWORD=lego -e POSTGRES_DB=lego_mosaik postgres:18-alpine
          docker run -d --name app --network smoke -p 8080:8080 --read-only --tmpfs /tmp \
            -v mosaike:/var/lib/lego-mosaik \
            -e LEGO_MOSAIK_DATABASE_URL=postgresql+psycopg://lego:lego@postgres:5432/lego_mosaik \
            "$IMAGE:sha-${GITHUB_SHA::7}" server --migrieren --warten 60
          for i in $(seq 60); do
            curl -sf localhost:8080/actuator/health/readiness && break
            sleep 2
          done
          curl -sf localhost:8080/actuator/health/readiness
          curl -sf localhost:8080/actuator/info
      - name: Logs bei Fehler
        if: failure()
        run: docker logs app || true
