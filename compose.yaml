# Cloud-Variante lokal: PostgreSQL + App (Mosaike im Volume "mosaike").
#
#   docker compose up --build -d
#   docker compose run --rm app katalog-import      # einmalig: Teilekatalog nach PostgreSQL
#   curl localhost:8080/actuator/health
#
# Die lokale App (uv run lego-mosaik …) läuft unabhängig davon weiter wie bisher.
# Alle Schlüssel hier sind NUR für die lokale Entwicklung gedacht.

name: lego-mosaik

x-app-env: &app-env
  LEGO_MOSAIK_DATABASE_URL: postgresql+psycopg://lego:lego@postgres:5432/lego_mosaik
  LEGO_MOSAIK_LOG_FORMAT: text
  LEGO_MOSAIK_CORS_ORIGIN_REGEX: ^https?://(localhost|127\.0\.0\.1)(:\d+)?$

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: lego
      POSTGRES_DB: lego_mosaik
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lego -d lego_mosaik"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: lego-mosaik:dev
    command: ["server", "--migrieren", "--warten", "60"]
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - mosaike:/var/lib/lego-mosaik
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/actuator/health/readiness')
      interval: 10s
      retries: 12

volumes:
  postgres:
  mosaike:
